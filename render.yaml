services:
  # 1. Node.js Express Backend Service
  - type: web
    name: skyguard-backend
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        value: https://skyguard-ai.vercel.app
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: skyguard-ml-service
          property: host

  # 2. Python FastAPI ML Service
  - type: web
    name: skyguard-ml-service
    env: python
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
